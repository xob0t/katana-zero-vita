# Builds the loader and publishes the web VPK builder (web/) to GitHub Pages when a version tag (v*) is pushed, then
# creates a GitHub release for the tag with notes generated from the merged pull requests.
# Pull requests and manual runs only build, and upload the site as an artifact to try first: the loader comes from a
# Linux softfp VitaSDK here, not the Windows one used locally, so test a build on a Vita before tagging it.
name: Web builder

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['loader/**', 'patches/**', 'scripts/**', 'web/**', 'tests/**', 'livearea/template.xml', 'build.py',
            'pyproject.toml', 'uv.lock', '.github/workflows/web-builder.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: atamanenko/vitasdk-softfp:latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Tests
        run: uv run --locked python -m unittest discover -s tests

      - name: Loader
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The app build packs LiveArea art, which is game art and not in the repository. The web builder draws its
          # own from the user's APK, so 1x1 placeholders do here.
          for f in icon0 bg0 startup; do
            echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg== | base64 -d > livearea/$f.png
          done
          # The container's softfp VitaSDK ($VITASDK) is used as it is; build.py builds the dependencies into it
          uv run --locked build.py --deps-dir "$RUNNER_TEMP/deps"
          test -s build/app/eboot.bin && test -s build/app/KatanaZero.vpk_param.sfo

      - name: Site
        run: |
          # The page loads web/, the APK scripts from scripts/ and the LiveArea template, all relative to the site root
          mkdir -p site/web/base site/scripts site/livearea
          cp -r web/. site/web/
          cp scripts/prepare_apk.py scripts/patch_plt_calls.py scripts/vita_glyphs.py scripts/extract_art.py \
             scripts/make_livearea.py site/scripts/
          cp livearea/template.xml site/livearea/
          cp build/app/eboot.bin site/web/base/eboot.bin
          cp build/app/KatanaZero.vpk_param.sfo site/web/base/param.sfo
          git describe --tags --always > site/web/base/version.txt
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=web/">\n' > site/index.html
          touch site/.nojekyll
          ls -la site/web/base

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # C host tests that need no game files: the background save writer, plain and under the sanitizers
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: asyncsave
        run: |
          # ThreadSanitizer can't map its shadow memory with the runner's 32-bit mmap randomization
          sudo sysctl -w vm.mmap_rnd_bits=28
          for san in "" "-fsanitize=address,undefined -fno-sanitize-recover=all" "-fsanitize=thread"; do
            echo "::group::asyncsave_test ${san:-(no sanitizer)}"
            gcc -O1 -g -Wall -pthread $san -Iloader/loader tests/asyncsave_test.c -o asyncsave-test
            ./asyncsave-test
            echo "::endgroup::"
          done

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}web/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            exit 0
          fi
          # --notes goes above the notes generated from the pull requests merged since the previous tag
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "To play this version, build the VPK from your APK with the [web builder](https://xob0t.github.io/katana-zero-vita/web/)." \
            || gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null
